{% extends "base.html" %}
{% block content %}
<h1>{{ _('title') }}</h1>
<p class="lede">{{ _('intro') }}</p>
<form method="post" action="/start">
  <fieldset>
    <legend>{{ _('choose_lang') }}</legend>
    <label class="choice"><input type="radio" name="ui_lang" value="en" {% if lang=='en' %}checked{% endif %}> English</label>
    <label class="choice"><input type="radio" name="ui_lang" value="tr" {% if lang=='tr' %}checked{% endif %}> Türkçe</label>
  </fieldset>
  <button type="submit">{{ _('start') }}</button>
</form>
{% endblock %}
