<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ _('title') }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if demo %}<div class="banner" role="status">{{ _('demo_banner') }}</div>{% endif %}
<main class="{% block mainclass %}page{% endblock %}">
{% block content %}{% endblock %}
</main>
{% if session %}{# Shared deadline, stop buttons and saving for every timed screen (static/session.js). #}
<script>window.SESSION = {{ session | tojson }};</script>
<script src="/static/session.js"></script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
