{% extends "base.html" %}
{% block content %}
<h1>{{ _('bg_title') }}</h1>
{% if error %}<p class="error" role="alert">{{ _('bg_same_lang') }}</p>{% endif %}
<form method="post" action="/background" class="stack">
  <label>{{ _('group') }}
    <select name="group" required>
      {% for g in groups %}<option value="{{ g }}">{{ _('group_' ~ g) }}</option>{% endfor %}
    </select>
  </label>
  <label>{{ _('age') }} <input type="number" name="age" min="10" max="99" required></label>
  <label>{{ _('education_years') }} <input type="number" name="education_years" min="0" max="40" required></label>
  <label>{{ _('years_reading_images') }} <input type="number" name="years_reading_images" min="0" max="60" step="0.5" value="0" required></label>
  <label>{{ _('bg_l1') }}
    <select name="l1" required>
      <option value="" disabled selected></option>
      {% for code, name in languages %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
    </select>
  </label>
  <fieldset class="scale">
    <legend>{{ _('bg_l1_reading') }}</legend>
    {% for v in range(1, 8) %}<label><input type="radio" name="l1_reading" value="{{ v }}" required><span>{{ v }}</span></label>{% endfor %}
  </fieldset>
  <label>{{ _('bg_l2') }}
    <select name="l2" required>
      <option value="" disabled selected></option>
      {% for code, name in languages %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
    </select>
  </label>
  <fieldset class="scale">
    <legend>{{ _('bg_l2_reading') }}</legend>
    {% for v in range(1, 8) %}<label><input type="radio" name="l2_reading" value="{{ v }}" required><span>{{ v }}</span></label>{% endfor %}
  </fieldset>
  <label>{{ _('l2_age') }} <input type="number" name="l2_age_acquired" min="0" max="99" required></label>
  <label>{{ _('native_lang') }}
    <select name="native_lang" required>
      <option value="" disabled selected></option>
      {% for code, name in all_languages %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
      <option value="other">{{ _('lang_other') }}</option>
    </select>
  </label>
  <button type="submit">{{ _('continue') }}</button>
</form>
{% endblock %}
