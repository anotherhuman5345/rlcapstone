{% extends "base.html" %}
{% block content %}
<h1>{{ _('retention_title') }}</h1>
<form method="post" action="/retention" class="stack">
  <fieldset>
    <legend>{{ _('retention_q') }}</legend>
    <div class="retention-grid">
    {% for n, word, wlang, wdir in shown %}<label class="choice"><input type="checkbox" name="checked" value="{{ n }}"> <span lang="{{ wlang }}" dir="{{ wdir }}">{{ word }}</span></label>{% endfor %}
    </div>
  </fieldset>
  <button type="submit">{{ _('continue') }}</button>
</form>
{% endblock %}
