<div class="sart">
  <svg id="sa-stage" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="{{ text.stage_label }}"
       style="display:block;margin:0 auto;background:#f7f9fb;border:1px solid #c7d0d8;border-radius:6px">
    <text id="sa-digit" x="200" y="150" text-anchor="middle" dominant-baseline="central" fill="#1d2731"
          font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="110" visibility="hidden"></text>
    <g id="sa-mask" stroke="#1d2731" stroke-width="10" fill="none" visibility="hidden">
      <circle cx="200" cy="150" r="62"/><line x1="156" y1="106" x2="244" y2="194"/><line x1="244" y1="106" x2="156" y2="194"/>
    </g>
  </svg>
  <div class="btn-row" style="justify-content:center">
    <button type="button" id="sa-press" style="min-width:12rem;min-height:4rem" disabled>{{ text.press }}</button>
  </div>
  <p style="text-align:center"><button type="button" id="sa-start">{{ text.start }}</button></p>
</div>
