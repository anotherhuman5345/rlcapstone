<div class="oddball">
  <svg id="ob-stage" viewBox="0 0 300 200" width="300" height="200"
       style="background:#F7F7F2;border:1px solid #C7D0D8;border-radius:6px;user-select:none" role="img"
       aria-label="{{ text.stage_label }}"></svg>
  <p class="meta">{{ text.target_is }}
    <svg viewBox="0 0 40 40" width="28" height="28" style="vertical-align:middle" aria-hidden="true">
      <rect x="6" y="6" width="28" height="28" fill="#2B6CB0"/></svg>
    &nbsp;·&nbsp; {{ text.ignore }}
    <svg viewBox="0 0 40 40" width="28" height="28" style="vertical-align:middle" aria-hidden="true">
      <circle cx="20" cy="20" r="15.8" fill="#2B6CB0"/></svg>
  </p>
  <div class="btn-row">
    <button type="button" id="ob-press" disabled style="min-width:12rem;touch-action:manipulation">{{ text.press }}</button>
  </div>
  <p><button type="button" id="ob-start">{{ text.start }}</button></p>
</div>
