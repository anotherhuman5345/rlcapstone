<style>
  .trail .board { position: relative; width: 100%; max-width: 60rem; aspect-ratio: 3 / 2; margin: 0 auto; background: #fafafa; border: 1px solid #ccc; border-radius: 6px; touch-action: manipulation; }
  .trail .board svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .trail .node { position: absolute; transform: translate(-50%, -50%); width: 7.5%; min-width: 2.3rem; aspect-ratio: 1; margin: 0; padding: 0; border-radius: 50%; background: #fff; color: #111; border: 2px solid #333; font-weight: 700; font-size: clamp(.85rem, 2.2vw, 1.3rem); display: flex; align-items: center; justify-content: center; }
  .trail .node.done { background: #cfe8d6; border-color: #1a7f37; }
  .trail .node.bad { background: #f6c9c4; border-color: #b42318; }
  .trail .node:focus-visible { outline: 3px solid #0072B2; outline-offset: 2px; }
</style>
<div class="trail">
  <div class="board" id="tm-board" hidden>
    <svg viewBox="0 0 1200 800" aria-hidden="true"><g id="tm-lines" stroke="#1a7f37" stroke-width="5" stroke-linecap="round"></g></svg>
    {% for nd in item.nodes %}<button type="button" class="node" data-node="{{ loop.index0 }}" style="left: {{ nd.x * 100 }}%; top: {{ nd.y * 100 }}%">{{ nd.label }}</button>{% endfor %}
  </div>
  <p><button type="button" id="tm-start">{{ text.start }}</button></p>
</div>
