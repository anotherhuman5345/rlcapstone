<style>
.srcmem [hidden] { display: none !important; }
.srcmem .sm-stage { display: flex; justify-content: space-between; align-items: center; max-width: 44rem; min-height: 230px; margin: 1rem 0; }
.srcmem .sm-slot { width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.6rem; font-weight: 700; padding: 1rem; visibility: hidden; }
.srcmem .sm-slot.on { visibility: visible; }
.srcmem .sm-circle { border: 5px solid var(--signal); border-radius: 50%; }
.srcmem .sm-square { border: 5px solid #8a5a00; border-radius: 0; }
.srcmem .sm-probe { font-size: 2.4rem; font-weight: 700; text-align: center; max-width: 44rem; min-height: 3.5rem; }
@media (max-width: 480px) { .srcmem .sm-slot { width: 150px; height: 150px; font-size: 1.2rem; } }
</style>
<div class="srcmem">
  <p class="meta" id="sm-phase" aria-live="polite"></p>
  <div class="sm-stage" id="sm-stage">
    <div class="sm-slot sm-circle" id="sm-circle"></div>
    <div class="sm-slot sm-square" id="sm-square"></div>
  </div>
  <p class="sm-probe" id="sm-probe" hidden></p>
  <div class="btn-row" id="sm-btns" hidden>
    <button type="button" data-key="circle">← ◯ {{ text.circle }}</button>
    <button type="button" data-key="new">↓ {{ text.new }}</button>
    <button type="button" data-key="square">{{ text.square }} □ →</button>
  </div>
  <p><button type="button" id="sm-start">{{ text.start }}</button></p>
</div>
