<div class="nv">
  <style>
    .nv .nv-card { border: 1px solid var(--line); border-radius: 6px; padding: 1.2rem; background: var(--paper); max-width: 42rem; min-height: 9rem; }
    .nv .nv-label { font-size: 2.2rem; font-weight: 700; letter-spacing: .04em; margin: .2rem 0 .6rem; }
    .nv .nv-text { font-size: 1.25rem; line-height: 1.45; margin: 0; }
    .nv .nv-prog { color: var(--muted); font-size: .95rem; margin: 0; }
    .nv .nv-opts { display: grid; gap: .5rem; max-width: 42rem; margin-top: 1rem; }
    .nv .nv-opts button { margin: 0; text-align: left; background: var(--paper); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
    .nv .nv-opts button .k { display: inline-block; min-width: 1.6rem; font-weight: 700; color: var(--muted); }
  </style>
  <div class="nv-card" id="nv-card" hidden>
    <p class="nv-prog" id="nv-prog"></p>
    <p class="nv-label" id="nv-label"></p>
    <p class="nv-text" id="nv-text"></p>
  </div>
  <div class="nv-opts" id="nv-opts"></div>
  <p><button type="button" id="nv-start">{{ text.start }}</button></p>
</div>
