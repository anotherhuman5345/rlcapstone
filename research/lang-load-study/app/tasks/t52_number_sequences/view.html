<style>
  .numpad { display: grid; grid-template-columns: repeat(3, 4.8rem); gap: .45rem; justify-content: center; margin-top: .5rem; }
  .numpad button { margin: 0; padding: .8rem 0; font-size: 1.3rem; }
  .numpad button[data-act="ok"] { font-size: 1rem; }
  .numpad button.alt { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .entry-box { min-width: 6rem; min-height: 3rem; padding: .2rem .8rem; border: 2px solid var(--signal); border-radius: 4px; background: var(--paper); text-align: center; font-size: 1.6rem; font-weight: 700; }
  .ns-row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; align-items: center; margin: 1.5rem 0 1rem; min-height: 3.4rem; }
  .ns-row .term { min-width: 3.6rem; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); text-align: center; font-size: 1.6rem; font-weight: 600; }
</style>
<div class="numseq">
  <div class="ns-row" id="ns-row" dir="ltr"></div>
  <div class="numpad" id="ns-pad" dir="ltr" hidden>
    {% for d in [7, 8, 9, 4, 5, 6, 1, 2, 3] %}<button type="button" data-d="{{ d }}">{{ d }}</button>{% endfor %}
    <button type="button" class="alt" data-act="back" aria-label="{{ text.erase }}">&#9003;</button>
    <button type="button" data-d="0">0</button>
    <button type="button" data-act="ok">{{ text.ok }}</button>
  </div>
  <p style="text-align:center"><button type="button" id="ns-start">{{ text.start }}</button></p>
</div>
