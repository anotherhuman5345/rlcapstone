<div class="route">
  <svg id="ro-map" width="520" height="520" viewBox="0 0 1040 1040" aria-hidden="true"
       style="display:block;background:#F7F4EC;border:1px solid var(--line);border-radius:6px;visibility:hidden"></svg>
  <div class="btn-row">
    <button type="button" id="ro-undo">{{ text.undo }}</button>
    <button type="button" id="ro-clear">{{ text.erase }}</button>
    <button type="button" id="ro-done">{{ text.done }}</button>
  </div>
  <p><button type="button" id="ro-start">{{ text.start }}</button></p>
</div>
