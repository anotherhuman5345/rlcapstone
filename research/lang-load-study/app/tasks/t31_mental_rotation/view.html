<div class="mrot">
  <svg id="mr-stage" viewBox="0 0 640 300" width="640" height="300" role="img" aria-hidden="true"
       style="display:block;background:#fff;border:1px solid var(--line);border-radius:6px"></svg>
  <div class="btn-row">
    <button type="button" data-key="same">← {{ text.same }}</button>
    <button type="button" data-key="mirror">{{ text.mirror }} →</button>
  </div>
  <p><button type="button" id="mr-start">{{ text.start }}</button></p>
</div>
