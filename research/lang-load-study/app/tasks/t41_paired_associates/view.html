<style>
.pairassoc [hidden] { display: none !important; }
.pairassoc .pa-card { display: flex; flex-direction: column; align-items: center; min-height: 260px; margin: 1rem 0; }
.pairassoc .pa-card svg { width: 160px; height: 160px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.pairassoc .pa-word { font-size: 2.2rem; font-weight: 700; min-height: 3rem; margin-top: .8rem; }
.pairassoc .pa-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .5rem; max-width: 44rem; }
.pairassoc .pa-opts button { margin: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--line); font-weight: 500; text-align: left; }
.pairassoc .pa-opts button .n { color: var(--muted); margin-right: .4rem; }
</style>
<div class="pairassoc">
  <p class="meta" id="pa-phase" aria-live="polite"></p>
  <div class="pa-card"><div id="pa-sym"></div><div class="pa-word" id="pa-word"></div></div>
  <div class="pa-opts" id="pa-opts" hidden>
    {% for w in item.options %}<button type="button" data-choice="{{ w }}"><span class="n">{{ loop.index }}</span>{{ text.words[w] }}</button>{% endfor %}
  </div>
  <p><button type="button" id="pa-start">{{ text.start }}</button></p>
</div>
