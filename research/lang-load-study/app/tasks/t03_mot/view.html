<div class="mot">
  <svg id="mot-stage" viewBox="0 0 {{ item.w }} {{ item.h }}" width="{{ item.w }}" height="{{ item.h }}"
       style="background:#22303C;border-radius:6px;user-select:none" role="img" aria-label="{{ text.stage_label }}"></svg>
  <div class="btn-row">
    <button type="button" id="mot-done" disabled>{{ text.done }}</button>
  </div>
  <p><button type="button" id="mot-start">{{ text.start }}</button></p>
</div>
