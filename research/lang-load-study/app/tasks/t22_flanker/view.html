<div class="flanker">
  <p class="big" id="fl-display" aria-live="off">+</p>
  <div class="btn-row">
    <button type="button" data-key="left">← {{ text.left }}</button>
    <button type="button" data-key="right">{{ text.right }} →</button>
  </div>
  <p><button type="button" id="fl-start">{{ text.start }}</button></p>
</div>
